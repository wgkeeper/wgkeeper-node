name: CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE_NAME: node
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          # Scan against the Go version we ship (go.mod), not latest stable.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so new linter releases don't break CI unexpectedly; bump manually.
          version: v2.15.0

  # Runs the image with a real WireGuard interface and a client container:
  # peer lifecycle, peer isolation and restart (see test/e2e/run.sh).
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t wgkeeper-node:e2e .

      - name: Run end-to-end test
        env:
          E2E_IMAGE: wgkeeper-node:e2e
        run: test/e2e/run.sh

  build_push:
    name: Build & Push Image
    needs: [test, e2e]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare image name (lowercase)
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${REGISTRY}/${OWNER_LC}/${SERVICE_NAME}" >> $GITHUB_ENV

      - name: Set VERSION for build
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            echo "VERSION=edge-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # ---------- TEST/NIGHTLY (push to main) ----------
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

            # ---------- RELEASE (push tag vX.Y.Z or vX.Y.Z-rc.N) ----------
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            # ---------- latest only for stable (no '-') ----------
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

            # (temporarily disabled)
            # type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify with: gh attestation verify oci://ghcr.io/wgkeeper/node:<tag> --owner wgkeeper
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: build_push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Notes are the "## [X.Y.Z]" section of CHANGELOG.md. A pre-release
      # (vX.Y.Z-rc.N) without its own section uses "## [Unreleased]", so release
      # candidates carry the notes of the release they lead to. Without either,
      # GitHub generates notes from commits.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it as is."
            exit 0
          fi
          section() {
            local name="$1"
            awk -v head="## [$name]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## / { exit }
              found && !started && $0 == "" { next }
              found { started = 1; print }
            ' CHANGELOG.md
          }
          section "$version" > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" && "$version" == *-* ]]; then
            { echo "Release candidate for ${version%%-*}. Not for production yet; please report problems in an issue."
              echo
              section "Unreleased"
            } > "$RUNNER_TEMP/notes.md"
          fi
          args=(--repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag)
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::No [$version] section in CHANGELOG.md, using generated notes."
            args+=(--generate-notes)
          fi
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}"
