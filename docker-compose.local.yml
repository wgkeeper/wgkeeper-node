services:
  wireguard:
    image: ghcr.io/wgkeeper/node
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wireguard:/etc/wireguard
      # Peer store (bbolt). Keep it: without this volume every peer is lost when the container is recreated.
      - ./data:/var/lib/wgkeeper
    ports:
      - "51820:51820/udp"
      # The API is plain HTTP, so it is published on this host's loopback only.
      # To reach it from other machines, use docker-compose.prod-secure.yml
      # (Caddy with HTTPS) instead of publishing it on all interfaces.
      - "127.0.0.1:51821:51821"
      # Do NOT publish the metrics port (e.g. 9090) on the host.
      # Keep /metrics inside the Docker network — let Prometheus scrape
      # via the service name. See README → Metrics for an example.
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:51821/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Optional: Prometheus to scrape wireguard:9090 inside this network.
  # Enable `metrics:` in config.yaml first. Generate the token with:
  #   openssl rand -hex 32 > ./wgkeeper-token
  # Do NOT publish 9090 on the host — scrape only from inside Docker network.
  #
  # prometheus:
  #   image: prom/prometheus:v3.1.0
  #   restart: unless-stopped
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ./wgkeeper-token:/etc/prometheus/wgkeeper-token:ro
  #     - prometheus_data:/prometheus

# volumes:
#   prometheus_data:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:dead:beef::/64
