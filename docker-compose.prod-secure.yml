services:
  wireguard:
    image: ghcr.io/wgkeeper/node
    restart: always
    # Graceful shutdown waits for in-flight API requests and the expiry cleanup.
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wireguard:/etc/wireguard
      # Peer store (bbolt). Keep it: without this volume every peer is lost when the container is recreated.
      - ./data:/var/lib/wgkeeper
    # Caddy runs in this container's network namespace, so its ports are
    # published here. The API (51821) is never published: Caddy reaches it on
    # 127.0.0.1 and is the only HTTP(S) entry point.
    #
    # If `metrics:` is enabled in config.yaml, do NOT publish the metrics port
    # either. Run Prometheus in this compose project and scrape wireguard:9090.
    ports:
      - "51820:51820/udp"
      - "80:80"
      - "443:443"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:51821/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    # TLS, client IP filtering and any rate limiting live here, in the Caddyfile.
    # Restrict 80/443 on the host to your orchestrator via firewall as well.
    #
    # Sharing the node's network namespace means Caddy connects to the API from
    # loopback. If the wireguard container is recreated, restart Caddy too.
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:dead:beef::/64
