services:
  wireguard:
    image: ghcr.io/wgkeeper/node
    restart: always
    # Graceful shutdown waits for in-flight API requests and the expiry cleanup.
    stop_grace_period: 30s
    # NET_ADMIN is all the node needs. WireGuard is in the kernel since 5.6;
    # on older kernels load the module on the host (modprobe wireguard)
    # instead of granting the container SYS_MODULE.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wireguard:/etc/wireguard
      # Peer store (bbolt). Keep it: without this volume every peer is lost when the container is recreated.
      - ./data:/var/lib/wgkeeper
    # Only WireGuard is published. The API (51821) is reached by the proxy over
    # the Docker network and is never published on the host; peers can't reach
    # it through the tunnel either (the node drops their traffic to itself).
    #
    # If `metrics:` is enabled in config.yaml, do NOT publish the metrics port
    # either. Run Prometheus in this compose project and scrape wireguard:9090.
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    healthcheck:
      # /readyz also checks the WireGuard interface. The port must match server.port.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:51821/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    # The HTTPS entry point: TLS, client IP filtering and any rate limiting live
    # in the Caddyfile. Any reverse proxy works the same way (see README,
    # "Using another reverse proxy"). Restrict 80/443 to your orchestrator in
    # the host firewall as well.
    image: caddy:2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      wireguard:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:dead:beef::/64
