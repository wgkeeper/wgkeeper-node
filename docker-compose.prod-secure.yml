services:
  wireguard:
    image: ghcr.io/wgkeeper/node
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./wireguard:/etc/wireguard
      - ./certs:/app/certs:ro
    # Optional: persist peer store (set wireguard.peer_store_file: "/app/peers/peers.db" in config)
    # - ./peers:/app/peers
    # In production we expose only the WireGuard UDP port on the host.
    # The REST API port (51821) stays internal to the Docker network and is
    # only reachable via the Caddy reverse proxy.
    #
    # If `metrics:` is enabled in config.yaml, the metrics port lives only
    # inside this Docker network too. Do NOT publish it on the host. For
    # external scraping, run a separate Caddy site (e.g. metrics.example.com)
    # with mTLS, or run Prometheus in this same compose.
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:51821/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    # Production reverse proxy: the only public HTTP(S) entrypoint.
    # Combine with auth.api_key in config.yaml and restrict 80/443 on the host
    # via firewall / security group.
    #
    # NOTE: Caddy reaches the API over the docker bridge below (not loopback),
    # so if you use server.allowed_ips you MUST also set server.trusted_proxies
    # to the bridge subnet (172.18.0.0/16) — otherwise allowed_ips compares your
    # orchestrator's IP against Caddy's container IP and rejects every request.
    # See README → Deployment → production with Caddy.
    image: caddy:2
    restart: unless-stopped
    depends_on:
      wireguard:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:dead:beef::/64
