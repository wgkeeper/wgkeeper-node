version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - noctx
    - revive
    - gosec
    - unconvert
    - misspell
    - unparam
    - modernize
    - gocritic
    - usetesting
    - nilnil
    - sloglint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      severity: warning
    sloglint:
      # Log keys are snake_case (request_id, peer_id) so log queries stay predictable.
      key-naming-case: snake
  exclusions:
    rules:
      - path: '.*_test\.go$'
        linters:
          - errcheck
          - gosec
          - noctx
          - nilnil

formatters:
  enable:
    - gofmt
    - goimports
