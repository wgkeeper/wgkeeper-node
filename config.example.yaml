# Only auth.api_key and a subnet are required; everything else has a default.
# Unknown keys are errors.
server:
  # Plain HTTP, default 51821. For HTTPS and client IP filtering put a reverse
  # proxy in front (see README, Deployment, and examples/caddy, examples/nginx).
  port: 51821
auth:
  # At least 32 characters. Generate with: openssl rand -hex 32
  api_key: "REPLACE_WITH_32+_RANDOM_CHARS"
wireguard:
  interface: "wg0"
  # At least one of subnet or subnet6 is required. You can set both for dual-stack.
  subnet: "10.0.0.0/24"
  server_ip: "10.0.0.1"
  # Optional: IPv6 (prefix up to /126, e.g. /64 or /112; for /64 the first 65536 addresses are used)
  # subnet6: "fd00::/112"
  # server_ip6: "fd00::1"
  listen_port: 51820
  # Peers are always persisted to a bbolt file, created on first start.
  # Default: /var/lib/wgkeeper/peers.db (mounted as ./data in the compose files).
  # peer_store_file: "/var/lib/wgkeeper/peers.db"
  # routing:
  #   # Optional: outbound interface for NAT. Detected from the default route when unset.
  #   wan_interface: "eth0"
  #   # Let peers reach private networks (10/8, 172.16/12, 192.168/16, 100.64/10,
  #   # fc00::/7) through the node, e.g. an office LAN. Off: internet only.
  #   allow_private_networks: false
# Optional: Prometheus /metrics endpoint. Off by default.
#
# IMPORTANT: in Docker do NOT publish this port on the host. Keep the
# endpoint inside the Docker network and let Prometheus scrape via the
# service name (e.g. http://wireguard:9090/metrics).
#
# The token MUST be different from auth.api_key (a separate secret for the
# scrape plane). Generate one with: openssl rand -hex 32
#
# metrics:
#   port: 9090
#   token: "REPLACE_WITH_32+_RANDOM_CHARS"
