# Example nginx site for wgkeeper-node.
#
# nginx terminates TLS, optionally lets only your orchestrator through, and
# proxies to the node's plain-HTTP API. Put it in the http context (for example
# /etc/nginx/conf.d/wgkeeper.conf). Needs nginx 1.25.1+ for "http2 on".

# Optional rate limit, used by limit_req below.
# limit_req_zone $binary_remote_addr zone=wgkeeper:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optional: allow only your orchestrator.
    # allow 203.0.113.7;
    # deny all;

    # Optional: see limit_req_zone above.
    # limit_req zone=wgkeeper burst=30 nodelay;

    # The node rejects bodies over 256 KB itself.
    client_max_body_size 256k;

    location / {
        # Bare metal: the node on loopback. Docker: the service name, for
        # example http://wireguard:51821. Port must match server.port.
        proxy_pass http://127.0.0.1:51821;

        proxy_set_header Host $host;
        # Overwrite, don't append: the node logs this header as the client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The node allows requests up to 30s.
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
}
