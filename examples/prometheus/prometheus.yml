# Example Prometheus config for wgkeeper-node.
#
# In a Docker compose project where the node is the service named "wireguard",
# Prometheus reaches it over the Docker network (http://wireguard:9090). The
# metrics port is never published on the host. See README → Metrics.

global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wgkeeper
    authorization:
      type: Bearer
      # The same value as metrics.token in config.yaml. Generate with:
      #   openssl rand -hex 32 > wgkeeper-token
      # The file must exist before `docker compose up` (otherwise Docker
      # mounts an empty directory) and be readable by Prometheus, which runs
      # as nobody (UID 65534): chmod 644 ./wgkeeper-token.
      credentials_file: /etc/prometheus/wgkeeper-token
      # Or inline instead of the file:
      # credentials: "PASTE_THE_SAME_VALUE_AS_metrics.token"
    static_configs:
      - targets: ["wireguard:9090"]
